[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
# Bare "strands" is an unrelated package on PyPI.
name = "citadeldb-strands-agents"
dynamic = ["version"]
description = "Strands Agents session storage backed by Citadel: encrypted at rest, with deletes that destroy the key"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Yuriy Peysakhov" }]
keywords = ["strands", "strands-agents", "agents", "session", "memory", "encryption"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# A record replaces under its own id, which needs the keyed write added in 2.0.
dependencies = ["citadeldb>=2.0,<3", "strands-agents>=1.15,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://citadeldb.dev"
Repository = "https://github.com/yp3y5akh0v/citadel"

# The version comes from the release tag, so there is nothing to bump.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/citadeldb_strands_agents"]
