[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "citadeldb-llamaindex"
dynamic = ["version"]
description = "LlamaIndex vector storage backed by Citadel: encrypted at rest, with deletes that destroy the key"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Yuriy Peysakhov" }]
keywords = ["llamaindex", "llama-index", "rag", "vector-store", "memory", "encryption"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["citadeldb>=1.16", "llama-index-core>=0.12,<0.15"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://citadeldb.dev"
Repository = "https://github.com/yp3y5akh0v/citadel"

# The version comes from the release tag, so there is nothing to bump.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/citadeldb_llamaindex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
