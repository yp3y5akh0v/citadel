name: Release OpenAI Agents

# Pure-Python wheel; fetch-depth 0 or hatch-vcs cannot resolve the tag.

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packaging/citadeldb-openai-agents

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --outdir dist
      - name: Fail if the tag did not resolve to a release version
        run: |
          set -e
          ls dist
          # A dev version means the tag is unreachable; never publish it.
          if ls dist | grep -q "dev"; then
            echo "version resolved to a dev build; the tag is not reachable" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openai-agents-dist
          path: packaging/citadeldb-openai-agents/dist

  core:
    name: build citadeldb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --out core-dist --find-interpreter
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: core-dist

  test:
    name: test (py${{ matrix.python }})
    needs: [build, core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: openai-agents-dist
          path: packaging/citadeldb-openai-agents/dist
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packaging/citadeldb-openai-agents/core-dist
      - name: Install the wheel and run the suite against it
        run: |
          set -e
          pip install pytest pytest-asyncio numpy
          pip install --no-index --find-links core-dist citadeldb
          python -c "from importlib.metadata import version; print('citadeldb==' + version('citadeldb'))" > "$RUNNER_TEMP/citadeldb-constraint.txt"
          pip install --constraint "$RUNNER_TEMP/citadeldb-constraint.txt" dist/*.whl
          # Scratch dir so tests import the installed wheel, not ./src.
          mkdir -p /tmp/run && cp -r tests pyproject.toml /tmp/run/
          cd /tmp/run && pytest tests -q

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # OIDC publisher entry is per package and per workflow file.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openai-agents-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist
