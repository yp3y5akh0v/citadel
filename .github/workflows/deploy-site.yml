name: Deploy Site

on:
  push:
    branches: [master]
    paths-ignore:
      - 'LICENSE-*'
      - 'SECURITY.md'
      - '.github/FUNDING.yml'
      - '.github/*.png'
      - 'README.md'
      - 'crates/*/README.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install binaryen (provides wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build WASM
        run: |
          bash scripts/publish-wasm.sh
          mkdir -p site/static/wasm
          cp crates/citadel-wasm/pkg/citadel_wasm_bg.wasm site/static/wasm/
          cp crates/citadel-wasm/pkg/citadel_wasm.js site/static/wasm/

      - name: Install Zola
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin

      - name: Build site
        run: zola --root site build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/public/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
