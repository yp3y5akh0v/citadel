name: Scripts

# The main CI has scripts/** in paths-ignore, so a broken release script used to
# merge green. This is the cheap guard: syntax only, no build.
on:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bash syntax
        run: |
          for f in scripts/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f"
          done
      - name: node syntax
        run: |
          for f in scripts/*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done
      # A crate added to the workspace but not to the publish script fails the
      # release halfway through, after earlier crates are already on crates.io.
      - name: every publishable crate is in the publish script
        run: |
          missing=0
          for name in $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish == null) | .name' \
              | grep '^citadeldb' | tr -d '\r'); do
            if ! grep -qwF "$name" scripts/publish-crates.sh; then
              echo "missing from scripts/publish-crates.sh: $name"
              missing=1
            fi
          done
          exit $missing
